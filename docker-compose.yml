services:
  mysql:
    image: mysql:8.4
    container_name: schoolguard_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: schoolguard
      MYSQL_USER: schoolguard
      MYSQL_PASSWORD: schoolguard
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "schoolguard", "-pschoolguard"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    container_name: schoolguard_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app

  telegram_bot:
    build:
      context: ./backend
    container_name: schoolguard_telegram
    restart: unless-stopped
    env_file:
      - .env
    command: python -m bot.main
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: schoolguard_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
